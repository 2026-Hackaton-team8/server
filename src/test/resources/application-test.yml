# 테스트 전용 설정: PostgreSQL 대신 H2 메모리 DB 사용 (Docker 불필요)
spring:
  datasource:
    url: jdbc:h2:mem:jibeo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-key-for-unit-tests-must-be-at-least-32-bytes-long