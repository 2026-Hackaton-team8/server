spring:
  application:
    name: Jibeo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key-at-least-32-bytes}
  access-token-validity-ms: ${JWT_ACCESS_VALIDITY_MS:1800000}
  refresh-token-validity-ms: ${JWT_REFRESH_VALIDITY_MS:604800000}

# 첨부 파일: 서버 인스턴스 역할(키 없음)로 S3 에 저장
storage:
  s3:
    bucket: ${S3_BUCKET:hackathon-e3-t08-data}
    region: ${S3_REGION:ap-northeast-3}
    url-ttl: 10m

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health

# the-sdk (https://github.com/themoment-team/the-sdk)
sdk:
  logging:
    not-logging-urls:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /actuator/**
  response:
    not-wrapping-urls:
      - /v3/api-docs/**
      - /v3/api-docs
      - /swagger-ui/**
      - /actuator/**
  swagger:
    title: Jibeo API
    description: Jibeo API Documentation
    paths-to-match:
      - /api/**
  exception:
    use-english-message: false
