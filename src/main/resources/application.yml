spring:
  application:
    name: Jibeo
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mydatabase}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key-at-least-32-bytes}
  access-token-validity-ms: ${JWT_ACCESS_VALIDITY_MS:1800000}
  refresh-token-validity-ms: ${JWT_REFRESH_VALIDITY_MS:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# the-sdk (https://github.com/themoment-team/the-sdk)
sdk:
  swagger:
    title: Jibeo API
    description: Jibeo API Documentation
    paths-to-match:
      - /api/**
  exception:
    use-english-message: false
