services:
  mysql:
    image: mysql:8.0
    container_name: jibeo-mysql
    environment:
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: verysecret
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pverysecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: jibeo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: jibeo-app
    profiles: ["full"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mydatabase
      DB_USERNAME: myuser
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-in-production-this-is-a-dev-only-secret-key-at-least-32-bytes
      JWT_ACCESS_VALIDITY_MS: "1800000"
      JWT_REFRESH_VALIDITY_MS: "604800000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      TZ: Asia/Seoul
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  redis-data:
