name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build jar
        run: ./gradlew bootJar --no-daemon

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload jar
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)
          scp -i ~/.ssh/deploy_key "$JAR" "$SERVER_USER@$SERVER_HOST:/home/ubuntu/app/jibeo.jar.new"

      - name: Deploy and health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOF'
          set -e
          cd /home/ubuntu/app
          [ -f jibeo.jar ] && cp jibeo.jar jibeo.jar.bak
          mv jibeo.jar.new jibeo.jar
          sudo systemctl restart jibeo

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/actuator/health; then
              echo "Deploy succeeded"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed. Recent logs:"
          sudo journalctl -u jibeo -n 50 --no-pager
          if [ -f jibeo.jar.bak ]; then
            echo "Rolling back to previous jar"
            mv jibeo.jar.bak jibeo.jar
            sudo systemctl restart jibeo
          fi
          exit 1
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key