name: CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 테스트는 테스트용 DB 설정 후 추가 (현재 contextLoads는 DB 없이 실패)
      - name: Build
        run: ./gradlew bootJar compileTestJava --no-daemon
